<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2f6df6" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<title>머니노트</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <header class="topbar">
      <h1 id="topTitle">머니노트</h1>
      <span id="modeBadge" class="badge" hidden></span>
    </header>

    <main id="view" class="view" aria-live="polite"></main>

    <nav class="tabbar" role="tablist">
      <button class="tab" data-tab="entry" type="button"><span class="ico">✏️</span><span>입력</span></button>
      <button class="tab" data-tab="daily" type="button"><span class="ico">📅</span><span>일별</span></button>
      <button class="tab" data-tab="monthly" type="button"><span class="ico">📊</span><span>월별</span></button>
      <button class="tab" data-tab="settings" type="button"><span class="ico">⚙️</span><span>설정</span></button>
    </nav>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
